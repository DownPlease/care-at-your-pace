# Пересылает уведомления о новых отзывах в Telegram.
# Сервис отзывов в Yandex Cloud: оттуда api.telegram.org недоступен, а API Gateway недоступен с раннеров GitHub,
# поэтому очередь сообщений лежит в Object Storage, workflow забирает её и отправляет через бота.
# Секреты репозитория: TG_BOT_TOKEN, REVIEWS_OUTBOX_SECRET.
name: Reviews relay
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: reviews-relay
  cancel-in-progress: false
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - run: python3 .github/scripts/reviews_relay.py
        env:

          REVIEWS_OUTBOX_SECRET: ${{ secrets.REVIEWS_OUTBOX_SECRET }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
